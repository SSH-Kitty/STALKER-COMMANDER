# Tests the Windows version, then builds it on every push to the
# main branch, or by hand from the Actions tab. Two downloads:
#   "COMMANDER Portable"  - the app, ready to run (COMMANDER.exe + data\),
#                           with COMMANDER.exe.sha512sum
#   "COMMANDER Installer" - COMMANDER-Installer-<version>.exe and its
#                           .exe.sha512sum (attach both to a release: the
#                           installed version's self-update needs the pair)
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # One Qt for the tests and the build: the version the suite passes on.
  PYSIDE6_VERSION: "6.11.2"
  PYINSTALLER_VERSION: "6.11.1"
  INNOSETUP_VERSION: "6.7.0"

jobs:
  test:
    # Pinned, not windows-latest: a new image must not change the build unseen.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Fetch the Windows CLI and 7-Zip
        # Tests install real archives and run the real CLI, as the app does:
        # on Linux those binaries are in the repo, on Windows they are fetched
        # (pinned and hash-checked) - without them 14 tests fail.
        run: python scripts/fetch_windows_cli.py
      - name: Lint
        run: ruff check .
      - name: Test
        # The Windows-only tests (test_windows_port, test_winruntimes) run here.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt "PySide6==${{ env.PYSIDE6_VERSION }}" pillow==11.0.0
      - name: Install PyInstaller with a bootloader built here
        # The prebuilt bootloader in the PyInstaller wheel is byte-for-byte the
        # same in thousands of unrelated programs, malware included, which is
        # the most common reason antivirus flags a PyInstaller app. Built from
        # source, COMMANDER.exe's launcher is its own. Falls back to the wheel
        # (with a warning) so a compiler problem never blocks a build.
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::The PyInstaller bootloader could not be built from source; using the prebuilt one."
            pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Fetch the Windows CLI and 7-Zip
        run: python scripts/fetch_windows_cli.py
      - name: Build
        run: pyinstaller --noconfirm packaging/windows/commander.spec
      - name: Smoke test the build
        # The frozen app must start its helper modules (ASSISTANT, the cancel
        # helper) and refuse anything else.
        shell: pwsh
        run: |
          $exe = "dist/COMMANDER/COMMANDER.exe"
          $p = Start-Process $exe -ArgumentList "-m", "not.a.module" -Wait -PassThru
          if ($p.ExitCode -ne 2) { Write-Error "unknown -m module was not refused (exit $($p.ExitCode))"; exit 1 }
          $p = Start-Process $exe -ArgumentList "-m", "commander_gui.winjob" -Wait -PassThru
          if ($p.ExitCode -ne 1) { Write-Error "winjob helper did not run (exit $($p.ExitCode))"; exit 1 }
          $info = (Get-Item $exe).VersionInfo
          if (-not $info.ProductName) { Write-Error "COMMANDER.exe has no version info"; exit 1 }
          Write-Output "COMMANDER.exe $($info.FileVersion) - $($info.ProductName)"
          # The app's files go in data\ (commander.spec's contents_directory).
          if (-not (Test-Path dist/COMMANDER/data/commander_gui)) { Write-Error "dist/COMMANDER/data is missing"; exit 1 }
          if (Test-Path dist/COMMANDER/_internal) { Write-Error "dist/COMMANDER still has an _internal folder"; exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          python packaging/windows/installer/make_images.py
          choco install innosetup --version "${{ env.INNOSETUP_VERSION }}" --no-progress -y
          $version = python -c "from commander_gui import __version__; print(__version__)"
          $numeric = [regex]::Match($version, '^\d+(\.\d+){0,3}').Value
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc.FullName "/DAppVersion=$version" "/DNumericVersion=$numeric" packaging/windows/installer/COMMANDER.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        # Each download carries its own checksum, so testers (and antivirus
        # false-positive reports) can tell the file they have is the one CI
        # built. SHA512, the format COMMANDER's self-update checks.
        shell: pwsh
        run: |
          function Write-Sha512($path) {
            $item = Get-Item $path
            "{0}  {1}" -f (Get-FileHash $item.FullName -Algorithm SHA512).Hash.ToLower(), $item.Name |
              Set-Content -Encoding ascii -NoNewline "$($item.FullName).sha512sum"
            Get-Content "$($item.FullName).sha512sum"
          }
          # Portable: a copy of the app with the checksum beside COMMANDER.exe.
          # A copy, so the installer (built above from dist/COMMANDER) never
          # gets the checksum file.
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item -Recurse dist/COMMANDER/* portable/
          Write-Sha512 portable/COMMANDER.exe
          # Installer: the installed version's self-update refuses a Setup
          # without this file next to it on the release (self_update.py).
          foreach ($setup in Get-ChildItem dist/COMMANDER-Installer-*.exe) { Write-Sha512 $setup.FullName }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # A folder's contents go in the artifact as they are: the download
          # unzips straight to COMMANDER.exe, data\ and the checksum.
          name: COMMANDER Portable
          path: portable/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: COMMANDER Installer
          path: |
            dist/COMMANDER-Installer-*.exe
            dist/COMMANDER-Installer-*.exe.sha512sum
          if-no-files-found: error
          # Inno Setup already compressed it (lzma2): zipping again only costs time.
          compression-level: 0

  moddb-plugin:
    # The ModDB browser plugin (Settings > Plugins): COMMANDER.exe leaves
    # QtWebEngine out, so the browser ships on its own. Same Python, Qt and
    # PyInstaller as COMMANDER, so the plugin's Qt matches the app's
    # (plugins.needs_update compares them). Attach the .tar.xz and its
    # .sha512sum to the release, next to the installer.
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # The PySide6 meta package: Essentials plus the Addons QtWebEngine is in.
        run: pip install -r requirements.txt "PySide6==${{ env.PYSIDE6_VERSION }}" pillow==11.0.0
      - name: Install PyInstaller with a bootloader built here
        # As for COMMANDER.exe: a bootloader of its own, not the one shared
        # with thousands of other programs that antivirus learned to flag.
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::The PyInstaller bootloader could not be built from source; using the prebuilt one."
            pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build
        run: pyinstaller --noconfirm packaging/windows/moddb-browser.spec
      - name: Prune, self-test and pack
        # The self-test fails the job unless the windowless exe reads its
        # stdin as UTF-8, starts Chromium and answers on stdout.
        run: python packaging/windows/pack_moddb_plugin.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: COMMANDER-ModDB-Browser-Plugin-windows-x86_64
          # Already xz-compressed: zipping it again only costs time.
          compression-level: 0
          path: |
            dist/COMMANDER-ModDB-Browser-Plugin-windows-*.tar.xz
            dist/COMMANDER-ModDB-Browser-Plugin-windows-*.tar.xz.sha512sum
