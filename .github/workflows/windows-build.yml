# Builds the portable Windows version (COMMANDER-windows-x64.zip) on every
# push to the COMMANDER-Windows branch, or by hand from the Actions tab.
name: Windows build

on:
  push:
    branches: [COMMANDER-Windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt PySide6==6.8.1 pyinstaller==6.11.1 pillow==11.0.0
      - name: Fetch the Windows CLI and 7-Zip
        run: python scripts/fetch_windows_cli.py
      - name: Build
        run: pyinstaller --noconfirm packaging/windows/commander.spec
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/COMMANDER -DestinationPath COMMANDER-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: COMMANDER-windows-x64
          path: COMMANDER-windows-x64.zip
