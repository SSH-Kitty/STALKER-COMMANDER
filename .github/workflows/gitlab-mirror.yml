name: Mirror to GitLab

# Copies every branch and tag to GitLab as a backup.
# Needs repo secret GITLAB_TOKEN (GitLab token with write_repository scope).
on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

concurrency: gitlab-mirror

# Only reads this repo; GitLab is written with its own token.
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push all branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        # The token goes in a header for this one command, not in the URL,
        # where git can echo it in error messages.
        run: |
          auth=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://gitlab.com/.extraheader=Authorization: Basic $auth" push --prune \
            "https://gitlab.com/commander-group3/stalker-commander.git" \
            '+refs/remotes/origin/*:refs/heads/*' \
            '^refs/remotes/origin/HEAD' \
            '+refs/tags/*:refs/tags/*'
